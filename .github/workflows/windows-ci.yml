name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 11 preview SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        shell: pwsh
        run: dotnet restore .\BetterTaskManager.slnx

      - name: Build Release
        shell: pwsh
        run: dotnet build .\BetterTaskManager.slnx -c Release --no-restore --nologo

      - name: Run non-destructive self-test
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\src\BetterTaskManager\bin\Release\net11.0-windows\BetterTaskManager.exe'
          $process = Start-Process -FilePath $exe.Path -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Run watchdog-backed UI smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\src\BetterTaskManager\bin\Release\net11.0-windows\BetterTaskManager.exe'
          $process = Start-Process -FilePath $exe.Path -ArgumentList '--ui-smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Run German localization UI smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\src\BetterTaskManager\bin\Release\net11.0-windows\BetterTaskManager.exe'
          $process = Start-Process -FilePath $exe.Path -ArgumentList @('--ui-smoke-test', '--language=de') -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Run repeated live-refresh UI soak test
        shell: pwsh
        run: |
          $exe = Resolve-Path '.\src\BetterTaskManager\bin\Release\net11.0-windows\BetterTaskManager.exe'
          $process = Start-Process -FilePath $exe.Path -ArgumentList '--ui-soak-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }

      - name: Publish self-contained portable executable
        shell: pwsh
        run: .\scripts\publish-v1.ps1

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Verify Windows installer lifecycle
        shell: pwsh
        run: .\scripts\test-installer.ps1

      - name: Upload portable package and installer
        uses: actions/upload-artifact@v7
        with:
          name: BetterTaskManager-win-x64
          path: |
            artifacts/BetterTaskManager-v*-portable-win-x64/
            artifacts/BetterTaskManager-v*-portable-win-x64.zip
            artifacts/BetterTaskManager-v*-setup-win-x64.exe
            artifacts/SHA256SUMS-v*.txt
          if-no-files-found: error
          retention-days: 14
