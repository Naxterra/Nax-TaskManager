name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-publish:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 11 preview SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Restore
        shell: pwsh
        run: dotnet restore .\BetterTaskManager.slnx

      - name: Build Release
        shell: pwsh
        run: dotnet build .\BetterTaskManager.slnx -c Release --no-restore --nologo

      - name: Publish Nax-TaskManager portable package
        shell: pwsh
        run: .\scripts\publish-fluent.ps1

      - name: History service console run
        shell: pwsh
        run: |
          # The runner is elevated, so this exercises the kernel network trace and the SQLite store for real.
          $portable = Get-ChildItem .\artifacts -Directory -Filter 'NaxTaskManager-v*-portable-win-x64' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $service = Join-Path $portable.FullName 'HistoryService\NaxTaskManager.HistoryService.exe'
          $db = Join-Path $env:RUNNER_TEMP 'history-ci.db'
          $process = Start-Process -FilePath $service -ArgumentList @('--console', '--db', $db, '--seconds', '15') -PassThru -NoNewWindow
          Invoke-WebRequest -Uri 'https://github.com' -UseBasicParsing | Out-Null
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw "History service console run failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $db) -or (Get-Item $db).Length -eq 0) { throw "History service did not create its database" }
          Write-Host "History database written: $((Get-Item $db).Length) bytes"

      - name: Build Windows installer
        shell: pwsh
        run: .\scripts\build-installer.ps1

      - name: Verify Windows installer lifecycle
        shell: pwsh
        run: .\scripts\test-installer.ps1

      - name: Upload portable package and installer
        uses: actions/upload-artifact@v7
        with:
          name: NaxTaskManager-win-x64
          path: |
            artifacts/NaxTaskManager-v*-portable-win-x64/
            artifacts/NaxTaskManager-v*-portable-win-x64.zip
            artifacts/NaxTaskManager-v*-setup-win-x64.exe
            artifacts/SHA256SUMS-v*.txt
          if-no-files-found: error
          retention-days: 14
