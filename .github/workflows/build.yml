name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      - name: Build
        run: dotnet build .\BetterTaskManager.slnx -c Release

      - name: Publish
        run: dotnet publish .\src\BetterTaskManager\BetterTaskManager.csproj -c Release -r win-x64 --self-contained false -o .\artifacts\BetterTaskManager-v1.0
